[build]
  command = "bun run build"
  publish = "dist/client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["dist/server/**", "node_modules/expo-server/**"]

# Old and duplicate routes
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/courses-tab"
  to = "/courses"
  status = 301
  force = true

[[redirects]]
  from = "/majors-tab"
  to = "/majors"
  status = 301
  force = true

[[redirects]]
  from = "/teachers-tab"
  to = "/teachers"
  status = 301
  force = true

# Universal links / App Clip: Apple requires JSON for the extension-less file
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

# Hashed bundles never change
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
