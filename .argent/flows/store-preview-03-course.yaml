executionPrerequisite: >-
  Courses tab, scrolled a little.
steps:
  - echo: "Tab bar: Opettajat"
  - tool: gesture-tap
    args: { x: 0.824, y: 0.945 }
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "Otto Lapsi" }, bundleId: com.tiedekunta.app, timeoutMs: 20000 }
  - wait: 800
  - echo: "Row: Otto Lapsi"
  - tool: gesture-tap
    args: { x: 0.5, y: 0.562 }
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "OPETTAA" }, bundleId: com.tiedekunta.app, timeoutMs: 20000 }
  - wait: 1800
