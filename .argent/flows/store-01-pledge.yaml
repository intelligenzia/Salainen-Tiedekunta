# SwiftUI screens are not visible to flow selectors, so these flows wait on the
# accessibility tree (await-ui-element) and tap by coordinate (iPhone 17 Pro Max).
steps:
  - launch: com.tiedekunta.app
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "Salassapitolupaus" }, bundleId: com.tiedekunta.app, timeoutMs: 20000 }
  - wait: 1200
