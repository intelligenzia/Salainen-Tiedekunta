executionPrerequisite: >-
  App on the home tab after accepting the pledge.
steps:
  - echo: "Tab bar: Kurssit"
  - tool: gesture-tap
    args: { x: 0.607, y: 0.945 }
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "Abduktio tutkimusmenetelmänä" }, bundleId: com.tiedekunta.app, timeoutMs: 20000 }
  - wait: 1500
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.75, toX: 0.5, toY: 0.5, durationMs: 700 }
  - wait: 1200
